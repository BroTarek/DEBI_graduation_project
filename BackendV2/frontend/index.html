<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <span class="logo-icon">▶</span>
            <h1>YouTube Clone</h1>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button>🔍</button>
        </div>
        <div class="user-actions">
            <button class="btn btn-upload" onclick="openCreateChannelModal()" style="margin-right: 8px;">Create Channel</button>
            <a href="upload.html" class="btn btn-upload">Upload Video</a>
            <div class="avatar">U</div>
        </div>
    </header>

    <main class="content">
        <div class="sidebar">
            <a href="#" class="sidebar-item active" id="sidebar-home" onclick="goHome(event)">🏠 Home</a>
            <div class="sidebar-section-title" style="font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 16px 0 8px 15px; text-transform: uppercase; letter-spacing: 0.5px;">Playlists</div>
            <div id="sidebar-playlists" style="display: flex; flex-direction: column; gap: 4px;">
                <div style="font-size: 12px; color: var(--text-secondary); padding: 5px 15px;">Loading...</div>
            </div>
        </div>

        <div class="video-grid" id="video-grid">
            <!-- Videos will be populated here by JavaScript -->
            <div class="loading">Loading videos...</div>
        </div>
    </main>

    <script src="app.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchVideos();
            fetchSidebarPlaylists();
        });
    </script>
</body>

</html>
